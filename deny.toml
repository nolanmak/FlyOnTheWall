# cargo-deny: the license allowlist is a hard gate.
# docs/REQUIREMENTS.md 2 -- no GPL/AGPL code enters this tree, and no
# unlicensed code either. A PR adding one must fail CI, not a review comment.

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unlicense",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Two incompatible objc2 majors in one binary means Retained/Encode/
# MainThreadMarker become distinct types across the boundary. See
# docs/REQUIREMENTS.md 5.5 (the cacao rejection).
deny = [{ name = "cacao" }]

# Enforced by the `advisories` job in .github/workflows/ci.yml, not by the
# `deny` job. That job runs on push to main, on pull requests and weekly, so a
# RustSec advisory or a yank against an unchanged Cargo.lock turns it red
# without failing the licenses/bans/sources gate on unrelated PRs.
[advisories]
yanked = "deny"
ignore = [
  # SQLite < 3.54.0 can return uninitialised page-cache memory when it opens a
  # database together with a `-wal` file of a different page size. No release
  # fixes our build: rusqlite's `bundled-sqlcipher` still bundles SQLite
  # 3.53.4 in libsqlite3-sys 0.39. Exposure needs a less trusted party to have
  # written the database pair, and fotwd only ever opens its own SQLCipher
  # library and its pre-migration backups under its own data folder (Db::open,
  # recovery::recover, migrations backups). A crafted file would also have to
  # be encrypted under the library key. Remove this once sqlcipher-src ships
  # SQLite >= 3.54.0.
  { id = "RUSTSEC-2026-0459", reason = "SQLCipher build has no fix yet; fotwd opens only its own encrypted library" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
