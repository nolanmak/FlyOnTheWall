# cargo-deny: the license allowlist is a hard gate.
# docs/REQUIREMENTS.md 2 -- no GPL/AGPL code enters this tree, and no
# unlicensed code either. A PR adding one must fail CI, not a review comment.

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unlicense",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Two incompatible objc2 majors in one binary means Retained/Encode/
# MainThreadMarker become distinct types across the boundary. See
# docs/REQUIREMENTS.md 5.5 (the cacao rejection).
deny = [{ name = "cacao" }]

# Enforced by the `advisories` job in .github/workflows/ci.yml, not by the
# `deny` job. That job runs on push to main, on pull requests and weekly, so a
# RustSec advisory or a yank against an unchanged Cargo.lock turns it red
# without failing the licenses/bans/sources gate on unrelated PRs.
[advisories]
yanked = "deny"
ignore = [
  # The checked-in lock selects rusqlite 0.40.2 and libsqlite3-sys 0.38.2.
  # The store builds with bundled-sqlcipher-vendored-openssl. The SQLCipher
  # amalgamation in that crate reports SQLite 3.51.3, below the 3.54.0 fix.
  # fotwd opens its own encrypted library and pre-migration backups under
  # its data directory. Recheck the bundled SQLite version when updating
  # libsqlite3-sys, and drop this exception once the selected build is fixed.
  { id = "RUSTSEC-2026-0459", reason = "Locked SQLCipher bundles SQLite 3.51.3; fotwd opens its own encrypted library and backups" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
