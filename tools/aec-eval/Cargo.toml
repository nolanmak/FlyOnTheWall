[package]
name = "fotw-aec-eval"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

# Evaluation is explicitly separate from the shipped app and its dependencies.
[workspace]

[features]
# Native C++ comparison is evaluation-only and opt-in; the app is unaffected.
native-webrtc = ["dep:webrtc-audio-processing"]
local-vqe = ["dep:libloading", "dep:sha2"]
# Uses only explicitly supplied, checksum-verified public fixtures/local weights.
speech-retention = ["dep:fotw-stt", "dep:fotw-audio", "dep:sha2"]

[dependencies]
fotw-pipeline = { path = "../../crates/fotw-pipeline" }
sonora = "=0.2.0"
serde_json = "1"
webrtc-audio-processing = { version = "=2.1.0", features = ["bundled", "experimental-aec3-config"], optional = true }
fotw-stt = { path = "../../crates/fotw-stt", features = ["local-whisper"], optional = true }
fotw-audio = { path = "../../crates/fotw-audio", optional = true }
sha2 = { version = "0.10", optional = true }
libloading = { version = "=0.8.9", optional = true }
