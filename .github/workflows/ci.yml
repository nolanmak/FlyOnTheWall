name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run for advisory jobs only, so an advisory published against an
  # unchanged Cargo.lock shows up without waiting for the next push. Every other
  # job skips scheduled runs.
  schedule:
    - cron: "17 6 * * 1"

# Least privilege lives in the workflow instead of depending on the repository's
# default token setting. No job here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Actions are pinned to full commit SHAs. The trailing comment names the tag the
# SHA was resolved from; for dtolnay/rust-toolchain it names the branch, because
# that action selects the toolchain by branch. .github/dependabot.yml proposes
# the bumps.

jobs:
  aec-eval-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: tools/aec-eval/Cargo.toml
          command: check advisories

  aec-eval-deny:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: tools/aec-eval/Cargo.toml
          command: check licenses bans sources

  aec-eval:
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/aec-eval
      # Generated audio only: no device, provider, model asset or credentials.
      - run: cargo fmt --manifest-path tools/aec-eval/Cargo.toml --check
      - run: cargo clippy --manifest-path tools/aec-eval/Cargo.toml --locked --all-targets
      - run: cargo test --manifest-path tools/aec-eval/Cargo.toml --locked
      - run: cargo run --release --manifest-path tools/aec-eval/Cargo.toml --locked

  aec-native:
    if: github.event_name != 'schedule'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/aec-eval
          key: native-webrtc
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libssl-dev pkg-config
      - name: Provision isolated native build tools
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/aec-build-tools"
          "$RUNNER_TEMP/aec-build-tools/bin/pip" install meson==1.11.1 ninja==1.13.0
          mkdir -p "$RUNNER_TEMP/aec-build-bin"
          # Upstream invokes Ninja without Cargo's job budget. Bound it too.
          cat > "$RUNNER_TEMP/aec-build-bin/ninja" <<'SH'
          #!/bin/sh
          exec "$RUNNER_TEMP/aec-build-tools/bin/ninja" -j3 "$@"
          SH
          chmod +x "$RUNNER_TEMP/aec-build-bin/ninja"
          echo "$RUNNER_TEMP/aec-build-tools/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/aec-build-bin" >> "$GITHUB_PATH"
      # Public C++ dependencies only; generated audio, no model or provider.
      - name: Check and measure native comparison
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/aec-build-bin:$PATH"
          cargo clippy --manifest-path tools/aec-eval/Cargo.toml --locked --all-features --all-targets
          cargo test --manifest-path tools/aec-eval/Cargo.toml --locked --all-features
          cargo run --release --manifest-path tools/aec-eval/Cargo.toml --locked --features native-webrtc
          cargo run --release --manifest-path tools/aec-eval/Cargo.toml --locked --features native-webrtc -- --heldout-signals
          cargo run --release --manifest-path tools/aec-eval/Cargo.toml --locked --features native-webrtc -- --clocked-signals
          cargo run --release --manifest-path tools/aec-eval/Cargo.toml --locked --features native-webrtc -- --bandlimited-signals

  keyring-interop:
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tests/keyring-interop
      - run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring libdbus-1-dev pkg-config
      - run: bash scripts/test-keyring-interop.sh

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  frontend:
    if: github.event_name != 'schedule'
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: node --test crates/fotw-web/tests/ui/*.cjs

  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # The pipeline must be provable with no audio device and no GUI.
      - run: cargo test --workspace
      # Default builds prove the admission API is absent via a compile-fail
      # doctest; retain synthetic AEC coverage only with explicit opt-in.
      - name: Test experimental AEC hooks without a native backend
        run: |
          cargo clippy -p fotwd --all-targets --features experimental-aec -- -D warnings
          cargo test -p fotwd --lib --features experimental-aec live_aec
          cargo test -p fotwd --test live_aec_session --features experimental-aec
      - name: Check opt-in resource QA entry point without assets
        run: python3 scripts/qa-local-contention.py --help

  deny:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources

  # RustSec advisories and yanked crates (deny.toml [advisories]). This is a
  # separate job from `deny` because an advisory can be published against a
  # Cargo.lock nobody touched: it should turn this check red, not the license,
  # bans and sources gate on an unrelated PR.
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  # The platform seam must not rot into macOS-shaped code. This costs seconds
  # and is the only thing that keeps a Windows port from being a rewrite.
  seam:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check -p fotw-audio --target x86_64-pc-windows-msvc
      - name: no platform types outside platform/macos
        run: |
          if grep -rn 'CMSampleBuffer\|AudioBufferList\|SCStream\|AudioDeviceID\|AudioObjectID' \
               crates/ --include='*.rs' \
               | grep -v 'crates/fotw-audio/src/platform/macos/'; then
            echo "::error::macOS types leaked outside fotw-audio/src/platform/macos/"
            exit 1
          fi
