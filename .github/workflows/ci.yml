name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run for the advisories job only, so an advisory published against an
  # unchanged Cargo.lock shows up without waiting for the next push. Every other
  # job skips scheduled runs.
  schedule:
    - cron: "17 6 * * 1"

# Least privilege lives in the workflow instead of depending on the repository's
# default token setting. No job here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Actions are pinned to full commit SHAs. The trailing comment names the tag the
# SHA was resolved from; for dtolnay/rust-toolchain it names the branch, because
# that action selects the toolchain by branch. .github/dependabot.yml proposes
# the bumps.

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The pipeline must be provable with no audio device and no GUI.
      - run: cargo test --workspace
      - run: node --test crates/fotw-web/tests/ui/*.cjs

  deny:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources

  # RustSec advisories and yanked crates (deny.toml [advisories]). This is a
  # separate job from `deny` because an advisory can be published against a
  # Cargo.lock nobody touched: it should turn this check red, not the license,
  # bans and sources gate on an unrelated PR.
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  # The platform seam must not rot into macOS-shaped code. This costs seconds
  # and is the only thing that keeps a Windows port from being a rewrite.
  seam:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check -p fotw-audio --target x86_64-pc-windows-msvc
      - name: no platform types outside platform/macos
        run: |
          if grep -rn 'CMSampleBuffer\|AudioBufferList\|SCStream\|AudioDeviceID\|AudioObjectID' \
               crates/ --include='*.rs' \
               | grep -v 'crates/fotw-audio/src/platform/macos/'; then
            echo "::error::macOS types leaked outside fotw-audio/src/platform/macos/"
            exit 1
          fi
