[workspace]
resolver = "3"
members = [
  "crates/fotw-audio",
  "crates/fotw-pipeline",
  "crates/fotw-stt",
  "crates/fotw-summarize",
  "crates/fotw-store",
  "crates/fotw-secrets",
  "crates/fotwd",
  "crates/fotw",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/nolanmak/FlyOnTheWall"

[workspace.dependencies]
# Keep every third-party version in one place. Pin exactly where the crate has
# shown release churn (see docs/REQUIREMENTS.md 5.1).
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
# Lock-free SPSC ring for the IOProc -> pump handoff. Chosen over ringbuf
# because its write_chunk_uninit/commit_all API makes the real-time contract
# explicit at the call site, and over crossbeam because ArrayQueue is MPMC
# with per-slot atomics and no bulk-memcpy path -- the wrong shape for audio
# blocks. See docs/REQUIREMENTS.md 5.1.
rtrb = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
