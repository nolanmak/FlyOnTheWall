[package]
name = "fotw-stt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Apps using an external local helper need contracts, not another model runtime.
local-whisper = ["dep:whisper-rs"]
conformance = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The FluidAudio helper's client (#243, #244): pure Rust, so every platform
# builds it. Parakeet Unified runs in that helper, never in this process.
fotw-speechd-client = { path = "../fotw-speechd-client" }
ulid = { workspace = true }
# The streaming transport (spec 7.4). Declared here rather than in
# [workspace.dependencies] because no other crate opens a socket to a provider.
#
# TLS is `native-tls` on purpose: Security.framework on macOS, schannel on
# Windows, the system OpenSSL on Linux. The rustls path pulls `ring` or
# `aws-lc-rs`, whose license expressions include `OpenSSL`, which is not on
# deny.toml's allowlist -- so it would fail the `deny` CI job.
futures-util = { workspace = true, features = ["sink", "std"] }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "handshake",
  "native-tls",
] }

# On-device transcription (#33): whisper.cpp, compiled from source by
# whisper-rs-sys with cmake, Metal and its shaders embedded in the binary.
# macOS only, like the capture it transcribes, so the Linux and Windows builds
# never need a C++ toolchain. Pinned exactly: whisper-rs has broken its API
# across minor releases (0.14 -> 0.15 replaced every segment accessor).
# Unlicense; whisper.cpp and ggml are MIT.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "=0.16.0", features = ["metal"], optional = true }

[dev-dependencies]
# The model-free speech helper, rebuilt for each test run (`testing::fake_helper`).
fotw-speechd-client = { path = "../fotw-speechd-client", features = ["testing"] }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
  "test-util",
] }
# Throwaway model stores for the helper tests; already in the lock.
tempfile = "3"
