<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>FlyOnTheWall</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <header>
      <h1>FlyOnTheWall</h1>
      <input
        id="search"
        type="search"
        placeholder="Search meetings, notes, transcripts"
        autocomplete="off"
        spellcheck="false"
      />
      <label id="consent-label" class="consent" hidden>
        <input id="consent" type="checkbox" />
        everyone consented
      </label>
      <button id="record" type="button" hidden>Start</button>
      <span id="recording" class="recording" hidden>recording</span>
      <span id="live" class="live" hidden>live</span>
    </header>
    <main>
      <nav id="list" aria-label="Meetings"></nav>
      <section id="detail" aria-live="polite"></section>
    </main>
    <details id="gh-settings" class="gh-settings" hidden>
      <summary>GitHub export</summary>
      <p class="gh-note">
        Commits a finished meeting's Markdown export to a repository of yours,
        using your own <code>gh</code> login. Nothing is sent until this is
        enabled.
      </p>
      <label class="gh-field">
        repository
        <input
          id="gh-repo"
          type="text"
          list="gh-repo-list"
          placeholder="owner/name"
          autocomplete="off"
          spellcheck="false"
        />
        <datalist id="gh-repo-list"></datalist>
      </label>
      <label class="gh-field">
        branch
        <input
          id="gh-branch"
          type="text"
          placeholder="default branch"
          autocomplete="off"
          spellcheck="false"
        />
      </label>
      <label class="gh-field">
        folder
        <input
          id="gh-prefix"
          type="text"
          placeholder="meetings/"
          autocomplete="off"
          spellcheck="false"
        />
      </label>
      <label class="gh-check">
        <input id="gh-auto" type="checkbox" />
        push automatically when a meeting finishes
      </label>
      <label class="gh-check">
        <input id="gh-enabled" type="checkbox" />
        enabled
      </label>
      <button id="gh-save" type="button">Save</button>
    </details>
    <p id="status" role="status"></p>
    <script src="/assets/app.js"></script>
  </body>
</html>
