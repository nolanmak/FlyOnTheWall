[package]
name = "fotwd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fotw-audio = { path = "../fotw-audio" }
fotw-pipeline = { path = "../fotw-pipeline" }
# The daemon owns the shell's state machine: meeting detection runs here, and
# CON-01 says detection may only *arm* it. Depending on the crate rather than
# duplicating `DetectedMeeting` is what makes `tests/detect.rs` able to drive
# the real state machine and prove that no detection reaches `StartCapture`.
fotw-shell = { path = "../fotw-shell" }
fotw-stt = { path = "../fotw-stt" }
fotw-summarize = { path = "../fotw-summarize" }
fotw-web = { path = "../fotw-web" }
fotw-secrets = { path = "../fotw-secrets" }
fotw-store = { path = "../fotw-store" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "native-tls", "json", "charset"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
# The recovery round trip creates several throwaway libraries per test and has
# to leave nothing behind when one fails mid-way -- the older
# `std::env::temp_dir()` pattern in this crate's other tests cleans up only on
# the happy path. Already in the lock file via fotw-store and fotw-secrets, so
# no new supply chain.
tempfile = "3"
